<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</helmet>
<div style="height:52px;flex:0 0 auto;padding:18px 30px 0;display:flex;justify-content:space-between;align-items:center;z-index:10;position:relative">
  <span style="{{ timeStyle }}">{{ time }}</span>
  <div style="display:flex;gap:8px;align-items:center">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="{{ fg }}"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="{{ fg }}" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.5a11 11 0 0 1 15 0"/><path d="M3.5 7.5a7 7 0 0 1 10 0"/><path d="M6 10.5a3 3 0 0 1 5 0"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="{{ fg }}" stroke-opacity="0.45" stroke-width="1.3"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="{{ fg }}"/><rect x="23.5" y="4" width="2" height="5" rx="1" fill="{{ fg }}"/></svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:52},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9:41&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const dark = (this.props.tone || 'light') === 'dark';
    const fg = dark ? '#F9F8F4' : '#14201A';
    return {
      fg,
      time: this.props.time || '9:41',
      timeStyle: "font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;letter-spacing:0.03em;color:" + fg
    };
  }
}
</script>
</body>
</html>
