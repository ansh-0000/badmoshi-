<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>@keyframes snshim{0%,100%{opacity:0.45}50%{opacity:1}}</style>
</helmet>
<div style="flex:1;overflow:hidden;padding:8px 22px 24px;display:flex;flex-direction:column;gap:16px;font-family:'Inter',sans-serif">
  <div style="display:flex;flex-direction:column;gap:9px;padding:8px 2px 0">
    <div style="width:96px;height:10px;border-radius:9999px;background:rgba(20,32,26,0.09);animation:snshim 1.5s ease-in-out infinite"></div>
    <div style="width:172px;height:24px;border-radius:8px;background:rgba(20,32,26,0.1);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.1s"></div>
  </div>

  <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;gap:9px">
      <div style="width:56px;height:32px;border-radius:9999px;background:rgba(58,82,69,0.12);animation:snshim 1.5s ease-in-out infinite"></div>
      <div style="width:82px;height:32px;border-radius:9999px;background:rgba(20,32,26,0.07);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.15s"></div>
      <div style="width:70px;height:32px;border-radius:9999px;background:rgba(20,32,26,0.07);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.3s"></div>
    </div>
    <sc-for list="{{ four }}" as="r" hint-placeholder-count="4">
      <div style="display:flex;gap:14px;padding:12px;background:#FFFFFF;border-radius:28px;box-shadow:0 12px 34px -22px rgba(20,32,26,0.35)">
        <div style="width:96px;height:96px;border-radius:20px;flex:0 0 auto;background:rgba(20,32,26,0.08);animation:snshim 1.5s ease-in-out infinite"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:10px;padding:6px 0;min-width:0">
          <div style="width:74%;height:14px;border-radius:9999px;background:rgba(20,32,26,0.09);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.1s"></div>
          <div style="width:52%;height:10px;border-radius:9999px;background:rgba(20,32,26,0.07);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.2s"></div>
          <div style="flex:1"></div>
          <div style="display:flex;justify-content:space-between;align-items:flex-end">
            <div style="width:88px;height:17px;border-radius:9999px;background:rgba(58,82,69,0.16);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.25s"></div>
            <div style="width:38px;height:12px;border-radius:9999px;background:rgba(20,32,26,0.07);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.3s"></div>
          </div>
        </div>
      </div>
    </sc-for>
  </sc-if>

  <sc-if value="{{ isDashboard }}" hint-placeholder-val="{{ false }}">
    <div style="height:156px;border-radius:28px;background:rgba(58,82,69,0.14);animation:snshim 1.5s ease-in-out infinite;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:26px">
      <div style="width:120px;height:10px;border-radius:9999px;background:rgba(58,82,69,0.2)"></div>
      <div style="width:190px;height:34px;border-radius:8px;background:rgba(58,82,69,0.22)"></div>
      <div style="width:100%;height:6px;border-radius:9999px;background:rgba(58,82,69,0.2)"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <sc-for list="{{ four }}" as="r" hint-placeholder-count="4">
        <div style="height:84px;border-radius:24px;background:#FFFFFF;box-shadow:0 12px 34px -22px rgba(20,32,26,0.35);padding:16px;display:flex;flex-direction:column;gap:10px">
          <div style="width:56%;height:9px;border-radius:9999px;background:rgba(20,32,26,0.08);animation:snshim 1.5s ease-in-out infinite"></div>
          <div style="width:72%;height:20px;border-radius:6px;background:rgba(20,32,26,0.1);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.15s"></div>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ two }}" as="r" hint-placeholder-count="2">
        <div style="height:60px;border-radius:24px;background:#FFFFFF;box-shadow:0 12px 34px -22px rgba(20,32,26,0.35);display:flex;align-items:center;gap:12px;padding:0 16px">
          <div style="width:36px;height:36px;border-radius:9999px;background:rgba(20,32,26,0.08);animation:snshim 1.5s ease-in-out infinite"></div>
          <div style="flex:1;height:12px;border-radius:9999px;background:rgba(20,32,26,0.08);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.1s"></div>
          <div style="width:62px;height:15px;border-radius:9999px;background:rgba(20,32,26,0.09);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.2s"></div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
    <div style="height:212px;border-radius:28px;background:rgba(20,32,26,0.08);animation:snshim 1.5s ease-in-out infinite"></div>
    <div style="display:flex;flex-direction:column;gap:11px">
      <div style="width:66%;height:24px;border-radius:8px;background:rgba(20,32,26,0.1);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.1s"></div>
      <div style="width:44%;height:11px;border-radius:9999px;background:rgba(20,32,26,0.07);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.2s"></div>
    </div>
    <div style="display:flex;gap:8px">
      <div style="width:74px;height:30px;border-radius:9999px;background:rgba(58,82,69,0.1);animation:snshim 1.5s ease-in-out infinite"></div>
      <div style="width:62px;height:30px;border-radius:9999px;background:rgba(58,82,69,0.1);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.12s"></div>
      <div style="width:88px;height:30px;border-radius:9999px;background:rgba(58,82,69,0.1);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.24s"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ three }}" as="r" hint-placeholder-count="3">
        <div style="height:11px;border-radius:9999px;background:rgba(20,32,26,0.07);animation:snshim 1.5s ease-in-out infinite"></div>
      </sc-for>
      <div style="width:58%;height:11px;border-radius:9999px;background:rgba(20,32,26,0.07);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.2s"></div>
    </div>
    <div style="height:72px;border-radius:28px;background:#FFFFFF;box-shadow:0 12px 34px -22px rgba(20,32,26,0.35)"></div>
  </sc-if>

  <sc-if value="{{ isForm }}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{ four }}" as="r" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="width:104px;height:9px;border-radius:9999px;background:rgba(20,32,26,0.08);animation:snshim 1.5s ease-in-out infinite"></div>
        <div style="height:54px;border-radius:9999px;background:rgba(20,32,26,0.06);border:1px solid rgba(20,32,26,0.08);animation:snshim 1.5s ease-in-out infinite;animation-delay:0.1s"></div>
      </div>
    </sc-for>
    <div style="flex:1"></div>
    <div style="height:56px;border-radius:9999px;background:rgba(58,82,69,0.18);animation:snshim 1.5s ease-in-out infinite"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:700},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;list&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;dashboard&quot;,&quot;detail&quot;,&quot;form&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const k = this.props.kind || 'list';
    return {
      isList: k === 'list',
      isDashboard: k === 'dashboard',
      isDetail: k === 'detail',
      isForm: k === 'form',
      two: [0,1], three: [0,1,2], four: [0,1,2,3]
    };
  }
}
</script>
</body>
</html>
