<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</helmet>
<div style="flex:0 0 auto;height:92px;background:rgba(249,248,244,0.94);backdrop-filter:blur(14px);border-top:1px solid rgba(20,32,26,0.07);display:flex;padding:14px 10px 0;font-family:'Inter',sans-serif">
  <div style="{{ wrap0 }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ sw0 }}" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
    <span style="{{ lbl0 }}">Portfolio</span>
  </div>
  <div style="{{ wrap1 }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ sw1 }}" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-5h6v5"/><path d="M9 10h.01M15 10h.01"/></svg>
    <span style="{{ lbl1 }}">Properties</span>
  </div>
  <div style="{{ wrap2 }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ sw2 }}" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/><path d="M6.5 15h4"/></svg>
    <span style="{{ lbl2 }}">Payments</span>
  </div>
  <div style="{{ wrap3 }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ sw3 }}" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.8L18.5 9l-4.9 1.2L12 15l-1.6-4.8L5.5 9l4.9-1.2L12 3Z"/><path d="M18.5 15.5l.5 1.7 1.7.5-1.7.5-.5 1.7-.5-1.7-1.7-.5 1.7-.5.5-1.7Z"/></svg>
    <span style="{{ lbl3 }}">Tira AI</span>
  </div>
  <div style="{{ wrap4 }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ sw4 }}" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4.2"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
    <span style="{{ lbl4 }}">Profile</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:92},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;portfolio&quot;,&quot;options&quot;:[&quot;portfolio&quot;,&quot;properties&quot;,&quot;payments&quot;,&quot;tira&quot;,&quot;profile&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const a = this.props.active || 'portfolio';
    const base = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;';
    const keys = ['portfolio','properties','payments','tira','profile'];
    const out = {};
    keys.forEach((k,i)=>{
      const act = a === k;
      out['wrap'+i] = base + (act ? 'color:#3A5245' : 'color:rgba(20,32,26,0.4)');
      out['lbl'+i] = 'font-size:10px;letter-spacing:0.04em;font-weight:' + (act ? 600 : 500);
      out['sw'+i] = act ? 1.9 : 1.75;
    });
    return out;
  }
}
</script>
</body>
</html>
